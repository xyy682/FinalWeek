name: finalweek

services:
  mysql:
    image: mysql:8.4.10
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-finalweek}
      MYSQL_USER: ${MYSQL_USER:-finalweek}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-finalweek_dev_password}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-finalweek_root_password}
    ports:
      - "${MYSQL_HOST_PORT:-3306}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${MYSQL_ROOT_PASSWORD:-finalweek_root_password}"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  redis:
    image: redis:8.4.5-alpine3.22
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_HOST_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  rabbitmq:
    image: rabbitmq:4.2.9-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER:-finalweek}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS:-finalweek_dev_password}
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-finalweek}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-finalweek_dev_password}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 20

  qdrant:
    image: qdrant/qdrant:v1.18.1
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant-data:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/127.0.0.1/6333'"]
      interval: 5s
      timeout: 5s
      retries: 20

  mailpit:
    image: axllent/mailpit:v1.30.0
    ports:
      - "1025:1025"
      - "8025:8025"
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build:
      context: ./backend
    environment:
      SPRING_PROFILES_ACTIVE: docker
      MYSQL_DATABASE: ${MYSQL_DATABASE:-finalweek}
      MYSQL_USER: ${MYSQL_USER:-finalweek}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-finalweek_dev_password}
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER:-finalweek}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS:-finalweek_dev_password}
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-finalweek}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-finalweek_dev_password}
      MINIO_BUCKET: ${MINIO_BUCKET:-finalweek}
      MINIO_REGION: ${MINIO_REGION:-us-east-1}
      MINIO_PUBLIC_ENDPOINT: ${MINIO_PUBLIC_ENDPOINT:-http://localhost:9000}
      PREVIEW_URL_TTL_MINUTES: ${PREVIEW_URL_TTL_MINUTES:-10}
      AUTH_CODE_TTL_MINUTES: ${AUTH_CODE_TTL_MINUTES:-10}
      AUTH_SEND_COOLDOWN_SECONDS: ${AUTH_SEND_COOLDOWN_SECONDS:-60}
      AUTH_RATE_WINDOW_MINUTES: ${AUTH_RATE_WINDOW_MINUTES:-10}
      AUTH_MAX_SENDS_PER_WINDOW: ${AUTH_MAX_SENDS_PER_WINDOW:-5}
      AUTH_MAX_VERIFY_ATTEMPTS: ${AUTH_MAX_VERIFY_ATTEMPTS:-5}
      COURSE_LIMIT: ${COURSE_LIMIT:-8}
      UPLOAD_TTL_HOURS: ${UPLOAD_TTL_HOURS:-24}
      UPLOAD_CHUNK_SIZE: ${UPLOAD_CHUNK_SIZE:-8MB}
      UPLOAD_CLEANUP_INTERVAL_MINUTES: ${UPLOAD_CLEANUP_INTERVAL_MINUTES:-15}
      DOCUMENT_MAX_SIZE_MB: ${DOCUMENT_MAX_SIZE_MB:-100}
      MEDIA_MAX_SIZE_MB: ${MEDIA_MAX_SIZE_MB:-2048}
      MEDIA_MAX_DURATION_MINUTES: ${MEDIA_MAX_DURATION_MINUTES:-120}
      PARSE_USER_RATE_PER_MINUTE: ${PARSE_USER_RATE_PER_MINUTE:-5}
      PARSE_GLOBAL_RATE_PER_MINUTE: ${PARSE_GLOBAL_RATE_PER_MINUTE:-30}
      TASK_EXCHANGE: ${TASK_EXCHANGE:-finalweek.tasks}
      TASK_ROUTING_KEY: ${TASK_ROUTING_KEY:-parse}
      TASK_QUEUE: ${TASK_QUEUE:-finalweek.parse}
      TASK_DLX: ${TASK_DLX:-finalweek.tasks.dlx}
      TASK_DLQ: ${TASK_DLQ:-finalweek.parse.dlq}
      TASK_CONFIRM_TIMEOUT_SECONDS: ${TASK_CONFIRM_TIMEOUT_SECONDS:-5}
      TASK_STALE_PENDING_SECONDS: ${TASK_STALE_PENDING_SECONDS:-30}
      TASK_STALE_SCAN_SECONDS: ${TASK_STALE_SCAN_SECONDS:-30}
      TASK_PROGRESS_TTL_HOURS: ${TASK_PROGRESS_TTL_HOURS:-24}
      TASK_MAX_DELIVERY_ATTEMPTS: ${TASK_MAX_DELIVERY_ATTEMPTS:-3}
      PLAN_USER_RATE_PER_MINUTE: ${PLAN_USER_RATE_PER_MINUTE:-5}
      CHAT_USER_RATE_PER_MINUTE: ${CHAT_USER_RATE_PER_MINUTE:-20}
      VECTOR_TOP_K: ${VECTOR_TOP_K:-20}
      BM25_TOP_K: ${BM25_TOP_K:-20}
      FINAL_TOP_K: ${FINAL_TOP_K:-8}
      RRF_K: ${RRF_K:-60}
      PLAN_REQUEST_TIMEOUT_SECONDS: ${PLAN_REQUEST_TIMEOUT_SECONDS:-60}
      CHAT_REQUEST_TIMEOUT_SECONDS: ${CHAT_REQUEST_TIMEOUT_SECONDS:-60}
      CHAT_HISTORY_LIMIT: ${CHAT_HISTORY_LIMIT:-20}
      BAILIAN_ASR_MODEL: ${BAILIAN_ASR_MODEL:-paraformer-realtime-v2}
      BAILIAN_OCR_MODEL: ${BAILIAN_OCR_MODEL:-qwen-vl-ocr-latest}
      BAILIAN_EMBEDDING_MODEL: ${BAILIAN_EMBEDDING_MODEL:-text-embedding-v4}
      BAILIAN_LLM_MODEL: ${BAILIAN_LLM_MODEL:-qwen3.7-plus}
      BAILIAN_API_KEY: ${BAILIAN_API_KEY:-}
      BAILIAN_ENDPOINT: ${BAILIAN_ENDPOINT:-https://dashscope.aliyuncs.com}
      BAILIAN_MAX_ATTEMPTS: ${BAILIAN_MAX_ATTEMPTS:-3}
    ports:
      - "8080:8080"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      minio:
        condition: service_healthy
      qdrant:
        condition: service_healthy
      mailpit:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s

  frontend:
    build:
      context: ./frontend
    ports:
      - "5173:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  mysql-data:
  redis-data:
  rabbitmq-data:
  minio-data:
  qdrant-data:
