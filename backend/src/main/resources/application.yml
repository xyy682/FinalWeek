spring:
  application:
    name: finalweek-backend
  datasource:
    url: ${MYSQL_URL:jdbc:mysql://localhost:3306/finalweek?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai}
    username: ${MYSQL_USER:finalweek}
    password: ${MYSQL_PASSWORD:finalweek_dev_password}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_DEFAULT_USER:finalweek}
    password: ${RABBITMQ_DEFAULT_PASS:finalweek_dev_password}
    publisher-confirm-type: correlated
    publisher-returns: true
    listener:
      simple:
        acknowledge-mode: manual
        prefetch: 1
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    properties:
      mail.smtp.auth: false
      mail.smtp.starttls.enable: false
  session:
    store-type: redis
    redis:
      namespace: fw:session

server:
  servlet:
    session:
      cookie:
        http-only: true
        secure: ${APP_COOKIE_SECURE:false}
        same-site: lax

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when_authorized

logging:
  structured:
    format:
      console: logstash

springdoc:
  swagger-ui:
    path: /swagger-ui.html

finalweek:
  task:
    exchange: ${TASK_EXCHANGE:finalweek.tasks}
    routing-key: ${TASK_ROUTING_KEY:parse}
    queue: ${TASK_QUEUE:finalweek.parse}
    dead-letter-exchange: ${TASK_DLX:finalweek.tasks.dlx}
    dead-letter-queue: ${TASK_DLQ:finalweek.parse.dlq}
    confirm-timeout: ${TASK_CONFIRM_TIMEOUT_SECONDS:5}s
    stale-pending-threshold: ${TASK_STALE_PENDING_SECONDS:30}s
    stale-scan-interval: ${TASK_STALE_SCAN_SECONDS:30}s
    progress-ttl: ${TASK_PROGRESS_TTL_HOURS:24}h
    max-delivery-attempts: ${TASK_MAX_DELIVERY_ATTEMPTS:3}
  storage:
    endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
    public-endpoint: ${MINIO_PUBLIC_ENDPOINT:http://localhost:9000}
    access-key: ${MINIO_ROOT_USER:finalweek}
    secret-key: ${MINIO_ROOT_PASSWORD:finalweek_dev_password}
    bucket: ${MINIO_BUCKET:finalweek}
    region: ${MINIO_REGION:us-east-1}
    chunk-size: ${UPLOAD_CHUNK_SIZE:8MB}
    cleanup-interval: ${UPLOAD_CLEANUP_INTERVAL_MINUTES:15}m
    preview-url-ttl: ${PREVIEW_URL_TTL_MINUTES:10}m
  auth:
    code-ttl: ${AUTH_CODE_TTL_MINUTES:10}m
    send-cooldown: ${AUTH_SEND_COOLDOWN_SECONDS:60}s
    rate-window: ${AUTH_RATE_WINDOW_MINUTES:10}m
    max-sends-per-window: ${AUTH_MAX_SENDS_PER_WINDOW:5}
    max-verify-attempts: ${AUTH_MAX_VERIFY_ATTEMPTS:5}
  limits:
    course-limit: ${COURSE_LIMIT:8}
    upload-ttl: ${UPLOAD_TTL_HOURS:24}h
    document-max-size-mb: ${DOCUMENT_MAX_SIZE_MB:100}
    media-max-size-mb: ${MEDIA_MAX_SIZE_MB:2048}
    media-max-duration: ${MEDIA_MAX_DURATION_MINUTES:120}m
    parse-user-rate-per-minute: ${PARSE_USER_RATE_PER_MINUTE:5}
    parse-global-rate-per-minute: ${PARSE_GLOBAL_RATE_PER_MINUTE:30}
    plan-user-rate-per-minute: ${PLAN_USER_RATE_PER_MINUTE:5}
    chat-user-rate-per-minute: ${CHAT_USER_RATE_PER_MINUTE:20}
  retrieval:
    vector-top-k: ${VECTOR_TOP_K:20}
    bm25-top-k: ${BM25_TOP_K:20}
    final-top-k: ${FINAL_TOP_K:8}
    rrf-k: ${RRF_K:60}
    chunk-max-tokens: ${CHUNK_MAX_TOKENS:512}
    chunk-overlap-tokens: ${CHUNK_OVERLAP_TOKENS:64}
    embedding-batch-size: ${EMBEDDING_BATCH_SIZE:10}
    embedding-dimensions: ${EMBEDDING_DIMENSIONS:1024}
    qdrant-endpoint: ${QDRANT_ENDPOINT:http://localhost:6333}
    qdrant-collection: ${QDRANT_COLLECTION:finalweek_segments}
    lucene-index-path: ${LUCENE_INDEX_PATH:./data/lucene}
  ai:
    endpoint: ${BAILIAN_ENDPOINT:https://dashscope.aliyuncs.com}
    api-key: ${BAILIAN_API_KEY:}
    max-attempts: ${BAILIAN_MAX_ATTEMPTS:3}
    outline-request-timeout: ${OUTLINE_REQUEST_TIMEOUT_SECONDS:180}s
    plan-request-timeout: ${PLAN_REQUEST_TIMEOUT_SECONDS:60}s
    chat-request-timeout: ${CHAT_REQUEST_TIMEOUT_SECONDS:60}s
    chat-history-limit: ${CHAT_HISTORY_LIMIT:20}
    asr-model: ${BAILIAN_ASR_MODEL:paraformer-realtime-v2}
    ocr-model: ${BAILIAN_OCR_MODEL:qwen-vl-ocr-latest}
    embedding-model: ${BAILIAN_EMBEDDING_MODEL:text-embedding-v4}
    llm-model: ${BAILIAN_LLM_MODEL:qwen3.7-plus}

---
spring:
  config:
    activate:
      on-profile: docker
  datasource:
    url: jdbc:mysql://mysql:3306/${MYSQL_DATABASE:finalweek}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
  data:
    redis:
      host: redis
  rabbitmq:
    host: rabbitmq
  mail:
    host: mailpit
finalweek:
  storage:
    endpoint: http://minio:9000
    public-endpoint: ${MINIO_PUBLIC_ENDPOINT:http://localhost:9000}
  retrieval:
    qdrant-endpoint: http://qdrant:6333
    lucene-index-path: /data/lucene
